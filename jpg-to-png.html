        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,

</head>


<body>


<header>

    <a href="../index.html">
        KYVORIX
    </a>

</header>


<main>


    <div class="eyebrow">
        IMAGE CONVERTER
    </div>


    <h1>
        JPG to PNG
    </h1>


    <p class="description">

        Convert your JPG images to PNG format directly
        in your browser. Your files stay on your device.

    </p>


    <section class="converter">


        <div
            class="drop-zone"
            id="dropZone"
        >

            <strong>
                Drop your image here
            </strong>

            <span>
                or select a JPG image from your device
            </span>

        </div>


        <label
            class="button"
            for="fileInput"
        >

            Choose JPG file

        </label>


        <input
            id="fileInput"
            type="file"
            accept="image/jpeg,.jpg,.jpeg"
        >


        <div
            class="file-info"
            id="fileInfo"
        >

            <div
                class="file-name"
                id="fileName"
            ></div>


            <div
                class="file-size"
                id="fileSize"
            ></div>

        </div>


        <button
            class="button"
            id="convertButton"
            type="button"
        >

            Convert to PNG

        </button>


        <div
            class="status"
            id="status"
        ></div>


    </section>


    <a
        class="back"
        href="../index.html"
    >

        ← Back to Kyvorix Tools

    </a>


</main>


<script>

    const fileInput =
        document.getElementById("fileInput");


    const dropZone =
        document.getElementById("dropZone");


    const fileInfo =
        document.getElementById("fileInfo");


    const fileName =
        document.getElementById("fileName");


    const fileSize =
        document.getElementById("fileSize");


    const convertButton =
        document.getElementById("convertButton");


    const status =
        document.getElementById("status");


    let selectedFile = null;


    function formatFileSize(bytes) {

        if (bytes < 1024) {

            return bytes + " B";

        }


        if (bytes < 1024 * 1024) {

            return (
                bytes / 1024
            ).toFixed(1) + " KB";

        }


        return (
            bytes / (1024 * 1024)
        ).toFixed(1) + " MB";

    }


    function handleFile(file) {

        if (!file) {
            return;
        }


        const isJpg =
            file.type === "image/jpeg" ||
            /\.(jpg|jpeg)$/i.test(file.name);


        if (!isJpg) {

            selectedFile = null;

            fileInfo.style.display =
                "none";

            convertButton.style.display =
                "none";

            status.textContent =
                "Please select a JPG image.";

            return;

        }


        selectedFile = file;


        fileName.textContent =
            file.name;


        fileSize.textContent =
            formatFileSize(file.size);


        fileInfo.style.display =
            "block";


        convertButton.style.display =
            "inline-block";


        status.textContent =
            "Image ready to convert.";


        // Analytics event
        gtag(
            "event",
            "file_selected",
            {
                tool: "jpg_to_png",
                file_type: "jpg"
            }
        );

    }


    fileInput.addEventListener(
        "change",
        function () {

            handleFile(
                this.files[0]
            );

        }
    );


    dropZone.addEventListener(
        "dragover",
        function (event) {

            event.preventDefault();

            dropZone.classList.add(
                "dragover"
            );

        }
    );


    dropZone.addEventListener(
        "dragleave",
        function () {

            dropZone.classList.remove(
                "dragover"
            );

        }
    );


    dropZone.addEventListener(
        "drop",
        function (event) {

            event.preventDefault();

            dropZone.classList.remove(
                "dragover"
            );


            const file =
                event.dataTransfer.files[0];


            handleFile(file);

        }
    );


    convertButton.addEventListener(
        "click",
        function () {

            if (!selectedFile) {

                status.textContent =
                    "Please select a JPG image first.";

                return;

            }


            convertButton.disabled =
                true;


            status.textContent =
                "Converting...";


            // Analytics event
            gtag(
                "event",
                "conversion_started",
                {
                    tool: "jpg_to_png"
                }
            );


            const image =
                new Image();


            const sourceUrl =
                URL.createObjectURL(
                    selectedFile
                );


            image.onload =
                function () {

                    try {

                        const canvas =
                            document.createElement(
                                "canvas"
                            );


                        canvas.width =
                            image.naturalWidth;


                        canvas.height =
                            image.naturalHeight;


                        const context =
                            canvas.getContext(
                                "2d"
                            );


                        if (!context) {

                            throw new Error(
                                "Canvas is not supported."
                            );

                        }


                        context.drawImage(
                            image,
                            0,
                            0,
                            canvas.width,
                            canvas.height
                        );


                        canvas.toBlob(
                            function (blob) {

                                if (!blob) {

                                    status.textContent =
                                        "Could not create PNG.";

                                    convertButton.disabled =
                                        false;

                                    URL.revokeObjectURL(
                                        sourceUrl
                                    );

                                    return;

                                }


                                const downloadUrl =
                                    URL.createObjectURL(
                                        blob
                                    );


                                const link =
                                    document.createElement(
                                        "a"
                                    );


                                link.href =
                                    downloadUrl;


                                link.download =
                                    selectedFile.name
                                        .replace(
                                            /\.(jpg|jpeg)$/i,
                                            ""
                                        )
                                        + ".png";


                                link.style.display =
                                    "none";


                                document.body.appendChild(
                                    link
                                );


                                link.click();


                                document.body.removeChild(
                                    link
                                );


                                status.textContent =
                                    "Conversion complete. PNG download started.";


                                // Analytics event
                                gtag(
                                    "event",
                                    "conversion_completed",
                                    {
                                        tool: "jpg_to_png",
                                        output_type: "png"
                                    }
                                );


                                // Analytics event
                                gtag(
                                    "event",
                                    "download",
                                    {
                                        tool: "jpg_to_png",
                                        file_type: "png"
                                    }
                                );


                                setTimeout(
                                    function () {

                                        URL.revokeObjectURL(
                                            downloadUrl
                                        );

                                    },
                                    5000
                                );


                                convertButton.disabled =
                                    false;

                            },
                            "image/png"
                        );


                    } catch (error) {

                        console.error(error);

                        status.textContent =
                            "Conversion failed.";


                        convertButton.disabled =
                            false;

                    }


                    URL.revokeObjectURL(
                        sourceUrl
                    );

                };


            image.onerror =
                function () {

                    URL.revokeObjectURL(
                        sourceUrl
                    );


                    status.textContent =
                        "Unable to read the JPG image.";


                    convertButton.disabled =
                        false;

                };


            image.src =
                sourceUrl;

        }
    );

</script>


</body>

</html>
